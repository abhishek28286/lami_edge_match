name: flazzor_edge_matcher
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  image_picker: ^1.1.2
  cupertino_icons: ^1.0.8
  path_provider: ^2.1.2         # लोकल फोल्डर के लिए
  permission_handler: ^11.3.0  # परमिशन के लिए
  webview_flutter: ^4.4.2      # 👈 कटलिस्ट ऑप्टिमाइज़र को इन-ऐप खोलने के लिए जरूरी है

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/flazzor_logo.png
    - assets/rehau.png
    - assets/square_one.jpg
    - assets/pegasus.jpg
    - assets/e3.jpg
    - assets/advance.jpg
    - assets/images/